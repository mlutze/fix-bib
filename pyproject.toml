[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fix_bib*"]

[project]
name = "fix-bib"
version = "1.0.0"
description = "A tool to fix and manage BibTeX files"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "bibtexparser>=2.0.0b0",
    "habanero>=1.2.0",
    "pylatexenc>=2.0",
    "unidecode>=1.3.0",
    "requests>=2.20.0",
]

[project.scripts]
fix-bib = "fix_bib:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
